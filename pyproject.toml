[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jack-lang"
version = "0.1.0"
description = "A small experimental language with explicit comptime evaluation."
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
jack = "jack.cli:main"
jack-lsp = "jack.lsp_server:main"

[tool.setuptools.packages.find]
include = ["jack*"]

[tool.setuptools.package-data]
jack = ["std/*.jack", "c_runtime/*"]
